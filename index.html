
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Resonance Monitor</title>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; padding-top: 50px; }
        #gauge { font-size: 72px; text-shadow: 0 0 20px #00ff00; }
        .status { color: #888; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>SYSTEM STATUS: 2.25 Δ</h1>
    <div id="gauge">123.74</div>
    <div class="status">Micro-Tesla (µT) Frequency detected.</div>
    <script>
        setInterval(() => {
            let variance = (Math.random() * 0.1 - 0.05).toFixed(2);
            document.getElementById('gauge').innerText = (123.74 + parseFloat(variance)).toFixed(2);
        }, 1000);
    </script>
</body>
</html>
