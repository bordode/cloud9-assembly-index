name: Historical v3 single-seed reproduction audit

on:
  workflow_dispatch:
  push:
    branches: [audit/null-ensemble-v3-provenance]
    paths:
      - 'research/validation/recovered_cloud9_null_ensemble_v3_corrected.py'
      - 'scripts/reproduce_cloud9_null_ensemble_v3_single_seed.py'
      - 'scripts/reproduce_cloud9_null_ensemble_v3_full_ensemble.py'
      - 'scripts/validate_v3_ksg_gaussian_diagnostic.py'
      - 'scripts/validate_v3_ksg_permutation_nonlinear.py'
      - 'scripts/validate_v3_ksg_reference_crosscheck.py'
      - 'scripts/validate_v3_ksg_raw_unclipped_boundary.py'
      - 'scripts/validate_v3_ksg_type_i_type_ii_hybrid.py'
      - 'scripts/test_v3_ksg_boundary_tie_counts.py'
      - 'scripts/validate_v3_ksg_type_ii_k_sensitivity.py'
      - 'scripts/validate_v3_ksg_type_ii_independent_reference.py'
      - '.github/workflows/v3-single-seed-reproduction.yml'

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy matplotlib scikit-learn
      - name: Run full 100-seed historical comparison
        run: python -m scripts.reproduce_cloud9_null_ensemble_v3_full_ensemble
      - name: Run KSG Gaussian diagnostic
        run: python -m scripts.validate_v3_ksg_gaussian_diagnostic
      - name: Run KSG permutation and nonlinear diagnostics
        run: python -m scripts.validate_v3_ksg_permutation_nonlinear
      - name: Run independent KSG implementation cross-check
        run: python -m scripts.validate_v3_ksg_reference_crosscheck
      - name: Run raw unclipped KSG and radius-boundary diagnostic
        run: python -m scripts.validate_v3_ksg_raw_unclipped_boundary
      - name: Compare complete KSG Type I, Type II and recovered hybrid conventions
        run: python -m scripts.validate_v3_ksg_type_i_type_ii_hybrid
      - name: Test hand-constructed KSG boundary and tie counts
        run: python -m scripts.test_v3_ksg_boundary_tie_counts
      - name: Run KSG Type I and Type II k-sensitivity study
        run: python -m scripts.validate_v3_ksg_type_ii_k_sensitivity
      - name: Independently cross-check complete KSG Type II estimator
        run: python -m scripts.validate_v3_ksg_type_ii_independent_reference
      - name: Upload comparison and estimator diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: v3-full-ensemble-reproduction
          path: |
            v3_full_ensemble_reproduction.json
            v3_ksg_gaussian_diagnostic.json
            v3_ksg_permutation_nonlinear_diagnostic.json
            v3_ksg_reference_crosscheck.json
            v3_ksg_raw_unclipped_boundary_diagnostic.json
            v3_ksg_type_i_type_ii_hybrid_comparison.json
            v3_ksg_type_ii_k_sensitivity.json
            v3_ksg_type_ii_independent_reference.json
          if-no-files-found: error
