name: Historical v3 single-seed reproduction audit

on:
  push:
    branches: [audit/null-ensemble-v3-provenance]
    paths:
      - 'research/validation/recovered_cloud9_null_ensemble_v3_corrected.py'
      - 'scripts/reproduce_cloud9_null_ensemble_v3_single_seed.py'
      - 'scripts/reproduce_cloud9_null_ensemble_v3_full_ensemble.py'
      - '.github/workflows/v3-single-seed-reproduction.yml'

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy matplotlib
      - name: Run full 100-seed historical comparison
        run: python -m scripts.reproduce_cloud9_null_ensemble_v3_full_ensemble
      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: v3-full-ensemble-reproduction
          path: v3_full_ensemble_reproduction.json
          if-no-files-found: error
