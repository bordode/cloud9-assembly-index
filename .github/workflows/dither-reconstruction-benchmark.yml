name: Dither reconstruction benchmark

on:
  push:
    branches:
      - research/dithered-stack-control-protocol
    paths:
      - 'research/sandbox/poisson_reconstruction.py'
      - 'scripts/run_dither_reconstruction_benchmark.py'
      - 'tests/test_poisson_reconstruction.py'
      - '.github/workflows/dither-reconstruction-benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run paired reconstruction benchmark
        run: python -m scripts.run_dither_reconstruction_benchmark
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: dither-reconstruction-benchmark
          path: dither_reconstruction_benchmark.json
          if-no-files-found: error
