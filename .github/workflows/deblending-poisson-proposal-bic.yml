name: Poisson proposal and BIC selection experiment

on:
  pull_request:
    branches: [research/poisson-deterministic-multistart]
    paths:
      - "research/sandbox/poisson_psf_deblending.py"
      - "research/sandbox/deblending_poisson_proposal_bic.py"
      - "scripts/run_deblending_poisson_proposal_bic.py"
      - "tests/test_deblending_poisson_proposal_bic.py"
      - ".github/workflows/deblending-poisson-proposal-bic.yml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run proposal/BIC tests
        run: python -m unittest tests.test_deblending_poisson_proposal_bic -v
      - name: Run fresh-seed three-way 90-trial comparison
        run: python scripts/run_deblending_poisson_proposal_bic.py --trials 10
      - name: Upload complete trial records
        uses: actions/upload-artifact@v4
        with:
          name: deblending-poisson-proposal-bic-comparison
          path: artifacts/deblending_poisson_proposal_bic.json
          if-no-files-found: error
          retention-days: 30
