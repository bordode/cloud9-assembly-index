name: Poisson AIC versus BIC acceptance benchmark

on:
  push:
    branches: [research/poisson-aic-vs-bic-acceptance]
    paths:
      - "research/sandbox/poisson_psf_deblending.py"
      - "research/sandbox/deblending_poisson_aic_bic_acceptance.py"
      - "tests/test_deblending_poisson_acceptance_criterion.py"
      - "scripts/run_deblending_poisson_aic_bic_acceptance.py"
      - "research/notes/poisson_aic_vs_bic_acceptance_protocol.md"
      - ".github/workflows/deblending-poisson-aic-bic-acceptance.yml"
  pull_request:
    branches: [research/poisson-adaptive-proposal-expansion]
    paths:
      - "research/sandbox/poisson_psf_deblending.py"
      - "research/sandbox/deblending_poisson_aic_bic_acceptance.py"
      - "tests/test_deblending_poisson_acceptance_criterion.py"
      - "scripts/run_deblending_poisson_aic_bic_acceptance.py"
      - "research/notes/poisson_aic_vs_bic_acceptance_protocol.md"
      - ".github/workflows/deblending-poisson-aic-bic-acceptance.yml"

permissions:
  contents: read

jobs:
  paired-aic-bic-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy pytest
      - name: Test criterion selection and compatibility
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_deblending_poisson_acceptance_criterion.py tests/test_deblending_poisson_adaptive_expansion.py
      - name: Run paired 27-trial six-method benchmark
        env:
          PYTHONPATH: .
        run: python scripts/run_deblending_poisson_aic_bic_acceptance.py --trials 3
      - name: Upload complete paired benchmark records
        uses: actions/upload-artifact@v4
        with:
          name: deblending-poisson-aic-bic-acceptance
          path: artifacts/deblending_poisson_aic_bic_acceptance.json
          if-no-files-found: error
          retention-days: 30
