name: Poisson candidate-depth ablation

on:
  push:
    branches: [research/poisson-proposal-fit-diversity]
    paths:
      - "research/sandbox/deblending_poisson_candidate_depth.py"
      - "research/sandbox/poisson_psf_deblending.py"
      - "research/sandbox/deblending_geometry_poisson.py"
      - "research/sandbox/pixel_response_reproduction.py"
      - "scripts/run_deblending_poisson_candidate_depth.py"
      - "tests/test_deblending_poisson_candidate_depth.py"
      - ".github/workflows/deblending-poisson-candidate-depth.yml"
      - "requirements.txt"
  pull_request:
    branches: [research/poisson-proposal-bic-selection]
    paths:
      - "research/sandbox/deblending_poisson_candidate_depth.py"
      - "research/sandbox/poisson_psf_deblending.py"
      - "research/sandbox/deblending_geometry_poisson.py"
      - "research/sandbox/pixel_response_reproduction.py"
      - "scripts/run_deblending_poisson_candidate_depth.py"
      - "tests/test_deblending_poisson_candidate_depth.py"
      - ".github/workflows/deblending-poisson-candidate-depth.yml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run candidate-depth tests
        run: python -m unittest tests.test_deblending_poisson_candidate_depth -v
      - name: Run paired 27-trial candidate-depth pilot
        run: python scripts/run_deblending_poisson_candidate_depth.py --trials 3
      - name: Upload complete ablation records
        uses: actions/upload-artifact@v4
        with:
          name: deblending-poisson-candidate-depth
          path: artifacts/deblending_poisson_candidate_depth.json
          if-no-files-found: error
          retention-days: 30
