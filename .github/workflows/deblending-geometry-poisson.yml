name: Deblending Gaussian versus Poisson likelihood experiment

on:
  pull_request:
    branches: [docs/aimy-laplacian-prior-external-research]
    paths:
      - "research/sandbox/deblending_geometry_poisson.py"
      - "research/sandbox/poisson_psf_deblending.py"
      - "scripts/run_deblending_geometry_poisson.py"
      - "tests/test_deblending_geometry_poisson.py"
      - ".github/workflows/deblending-geometry-poisson.yml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m unittest tests.test_deblending_geometry_poisson -v
      - name: Run paired 90-trial Gaussian versus Poisson grid
        run: python scripts/run_deblending_geometry_poisson.py --trials 10
      - name: Upload complete paired trial records
        uses: actions/upload-artifact@v4
        with:
          name: deblending-gaussian-poisson-comparison
          path: artifacts/deblending_geometry_poisson.json
          if-no-files-found: error
          retention-days: 30
